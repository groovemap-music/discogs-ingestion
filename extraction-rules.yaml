---
# Data Quality Rules for Discogs Extraction
# Configure via: DATA_QUALITY_RULES env var or --data-quality-rules CLI arg
#
# NOTE: The 'max' value in year-range rules is static and should be updated
# periodically (e.g., bump to current_year + 1 at the start of each year).

# Records matching ANY condition are skipped entirely —
# not validated, not published to consumers.
# Logged in the quality report and skipped.jsonl with reason.
skip_records:
  artists:
    - field: profile
      contains: "DO NOT USE"
      reason: "Upstream junk entry marked DO NOT USE"
  labels:
    - field: profile
      contains: "DO NOT USE"
      reason: "Upstream junk entry marked DO NOT USE"

# Field transforms applied before validation and publishing.
# Two types:
#   remove_matching — strip array elements matching a regex
#   nullify_when    — set a scalar field to null if it meets a range condition
filters:
  releases:
    - field: genres.genre
      remove_matching: "^\\d+$"
      reason: "Strip legacy numeric genre IDs from upstream data"
    # A Discogs *release* has no `year` field at extraction — its date lives in
    # `released` (a date string like "1969-09-26"). The nullify_when range filter
    # parses the leading year out of such date strings, so an implausible date
    # like "0400-01-01" is nullified here, at the extractor, before it reaches
    # any consumer. (data_normalizer._parse_year_int re-checks the bound as a
    # defensive backstop.)
    - field: released
      nullify_when:
        type: range
        below: 1860
        above: 2027
      reason: "Treat sentinel and implausible release dates as unknown"
    # Kept for robustness in case upstream ever emits a release `year` field.
    - field: year
      nullify_when:
        type: range
        below: 1860
        above: 2027
      reason: "Treat sentinel and implausible years as unknown"
  masters:
    - field: genres.genre
      remove_matching: "^\\d+$"
      reason: "Strip legacy numeric genre IDs from upstream data"
    - field: year
      nullify_when:
        type: range
        below: 1860
        above: 2027
      reason: "Treat sentinel and implausible years as unknown"

rules:
  releases:
    - name: year-out-of-range
      description: "Release year is before 1860 or after current year + 1"
      field: year
      condition:
        type: range
        min: 1860
        max: 2027
      severity: warning

    - name: missing-title
      description: "Release has no title"
      field: title
      condition:
        type: required
      severity: error

    - name: genre-not-recognized
      description: "Genre value is not in the known Discogs genre list"
      field: genres.genre
      condition:
        type: enum
        values:
          - Blues
          - Brass & Military
          - "Children's"
          - Classical
          - Electronic
          - "Folk, World, & Country"
          - Funk / Soul
          - Hip Hop
          - Jazz
          - Latin
          - Non-Music
          - Pop
          - Reggae
          - Rock
          - Stage & Screen
      severity: warning

    - name: genre-is-numeric
      description: "Genre value is purely numeric — likely a parsing error"
      field: genres.genre
      condition:
        type: regex
        pattern: "^\\d+$"
      severity: error

    - name: format-not-recognized
      description: "Format value is not in the vendored Discogs media taxonomy (contracts/catalog-events/vocab/media-taxonomy.json). Refresh this enum by re-running the list of discogs.formats keys after re-vendoring the taxonomy; see docs/extraction-rules-guide.md."
      field: formats.format.@name
      condition:
        type: enum
        values:
          - 4-Track Cartridge
          - 8-Track Cartridge
          - Acetate
          - All Media
          - Betacam
          - Betacam SP
          - Betamax
          - Blu-ray
          - Blu-ray-R
          - Box Set
          - CD
          - CDV
          - CDr
          - CED
          - Cassette
          - Cylinder
          - DAT
          - DCC
          - DVD
          - DVD-Audio
          - DVDr
          - DualDisc
          - Edison Disc
          - Elcaset
          - File
          - Film Reel
          - Flexi-disc
          - Floppy Disk
          - HD DVD
          - HD DVD-R
          - Hybrid
          - Laserdisc
          - Lathe Cut
          - Memory Stick
          - Microcassette
          - MiniDisc
          - Minidisc
          - Pathé Disc
          - PlayTape
          - Reel-To-Reel
          - SACD
          - SVCD
          - Shellac
          - UMD
          - Ultra HD Blu-ray
          - VCD
          - VHD
          - VHS
          - Video 2000
          - Video8
          - Vinyl
      severity: warning

    - name: identifier-type-not-recognized
      description: "Identifier type is not in the vendored Discogs identifier vocabulary (contracts/catalog-events/vocab/identifier-types.json). The identifiers block maps it to `other` and records it under `unmapped.types`; this rule surfaces the same fact in the data-quality report. Refresh this enum by re-running the list of discogs.types keys after re-vendoring the vocabulary; see docs/extraction-rules-guide.md."
      field: identifiers.identifier.@type
      condition:
        type: enum
        values:
          - "ASIN"
          - "Barcode"
          - "ISRC"
          - "Label Code"
          - "Mastering SID Code"
          - "Matrix / Runout"
          - "Mould SID Code"
          - "Other"
          - "Pressing Plant ID"
          - "Price Code"
          - "Rights Society"
          - "SPARS Code"
      severity: warning

    - name: company-role-not-recognized
      description: "Company role is not in the vendored Discogs company-role vocabulary (contracts/catalog-events/vocab/company-roles.json). The companies block maps it to `other` and records it under `unmapped.roles`; this rule surfaces the same fact in the data-quality report. Refresh this enum by re-running the list of discogs.roles keys after re-vendoring the vocabulary; see docs/extraction-rules-guide.md."
      field: companies.company.entity_type_name
      condition:
        type: enum
        values:
          - "Copyright (c)"
          - "Designed At"
          - "Distributed By"
          - "Duplicated By"
          - "Edited At"
          - "Engineered At"
          - "Exported By"
          - "Funded By"
          - "Glass Mastered At"
          - "Lacquer Cut At"
          - "Licensed From"
          - "Licensed Through"
          - "Licensed To"
          - "Made By"
          - "Manufactured By"
          - "Manufactured For"
          - "Marketed By"
          - "Mastered At"
          - "Mixed At"
          - "Phonographic Copyright (p)"
          - "Plated At"
          - "Pressed By"
          - "Printed By"
          - "Produced At"
          - "Produced For"
          - "Published By"
          - "Record Company"
          - "Recorded At"
          - "Recorded By"
      severity: warning

    # Note: years like 197 and 338 are already caught by year-out-of-range (< min 1860).

  artists:
    - name: empty-artist-name
      description: "Artist has no name"
      field: name
      condition:
        type: required
      severity: error

  labels:
    - name: empty-label-name
      description: "Label has no name"
      field: name
      condition:
        type: required
      severity: error

  masters:
    - name: year-out-of-range
      description: "Master year is before 1860 or after current year + 1"
      field: year
      condition:
        type: range
        min: 1860
        max: 2027
      severity: warning
