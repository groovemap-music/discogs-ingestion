version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, github-actions]
    open-pull-requests-limit: 5
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-version:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, rust]
    open-pull-requests-limit: 10
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
      cargo-version:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
    open-pull-requests-limit: 5
    groups:
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
      docker-version:
        applies-to: version-updates
        patterns: ["*"]
