[package]
name = "discogs-ingestion"
version = "0.3.0"
edition = "2024"
authors = ["Robert Wlodarczyk <robert@simplicityguy.com>"]
description = "Discogs catalog ingestion and event-contract producer"
repository = "https://github.com/groovemap-music/discogs-ingestion"
homepage = "https://groovemap.music"
license = "MIT"
publish = false

[[bin]]
name = "discogs-ingestion"
path = "src/main.rs"

[lib]
name = "extractor"
path = "src/lib.rs"

[features]
test-support = ["mockall"]

[dependencies]
# Core async runtime
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["io-util"] }

# XML parsing (following disco-quick's approach)
quick-xml = { version = "0.42", features = ["serialize"] }
encoding_rs = "0.8.35"
encoding_rs_io = "0.1.8"

# Compression handling
flate2 = "1.1"
xz2 = "0.1"
tar = "0.4"

# Message queue (AMQP) - latest
lapin = "4.10"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"

# Hashing
sha2 = "0.11"
hex = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
config = "0.15"
dotenvy = "0.15"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# HTTP client for downloads (replaces AWS S3 SDK)
reqwest = { version = "0.13", features = ["json", "stream", "rustls"] }
bytes = "1.12"
regex = "1.13"
urlencoding = "2.1"

# Progress tracking
indicatif = "0.18"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Command-line interface
clap = { version = "4.6", features = ["derive", "env"] }

# Health monitoring
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }

# OpenTelemetry metrics and traces (OTLP/HTTP-protobuf push to the collector)
opentelemetry = { version = "0.32", default-features = false, features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics", "trace"] }
# `reqwest-blocking-client` is the client the default PeriodicReader is documented to work
# with: the reader owns a dedicated OS thread and drives the export from there, so no
# tokio worker is ever blocked. The crate builds the blocking client on its own thread, so
# constructing the exporter from inside `#[tokio::main]` is safe.
# The `BatchSpanProcessor` on the trace side owns a dedicated OS thread in exactly the same
# way, so the traces pipeline shares the metrics pipeline's transport and threading model.
# `http-proto` + `reqwest-blocking-client` and NO `grpc-tonic`: the collector speaks
# OTLP/HTTP-protobuf and a tonic dependency must never enter the lock file.
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
  "metrics",
  "trace",
  "http-proto",
  "reqwest-blocking-client",
  "internal-logs",
] }
# Bridges `tracing` spans onto the OpenTelemetry tracer. `default-features = false` drops the
# crate's own metrics bridge — this repository records its metrics directly — and the
# `tracing-log` bridge, which nothing here uses.
tracing-opentelemetry = { version = "0.33", default-features = false }

# Utilities
once_cell = "1.21"
parking_lot = "0.12"
num_cpus = "1.17"
url = "2.5"  # URL parsing for AMQP connection normalization

# Trait object support for async traits (needed for dyn-compatible async trait methods)
async-trait = "0.1"

# Mock generation for trait-based testing (behind feature flag)
mockall = { version = "0.15", optional = true }

[dev-dependencies]
extractor = { package = "discogs-ingestion", path = ".", features = ["test-support"] }
tempfile = "3.27"
tokio = { version = "1.53", features = ["test-util"] }
mockito = "1.7"
proptest = "1.11"
criterion = "0.8"
serial_test = "4.0.1"
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics", "trace", "testing"] }

[[bench]]
name = "parser_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

# Project-scoped cargo tools managed via cargo-run-bin
# Install cargo-run-bin once: cargo install cargo-run-bin
# Then install all tools: cargo bin --install
# Run tools with: cargo bin <tool-name>
[package.metadata.bin]
cargo-outdated = { version = "0.17.0" }

# Lint configuration - treat all warnings as errors
# This is equivalent to running: cargo clippy -- -D warnings
# Ensures no warnings can slip through in development or CI
[lints.rust]
warnings = "deny"  # Treat all Rust compiler warnings as errors
